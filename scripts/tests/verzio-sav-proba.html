<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verzió-sáv — látványpróba (hamis adat)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<style>
  .pt{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 18px}
  .pt td,.pt th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
  .pt th{color:var(--muted);font-weight:600}
  .megy{color:var(--green);font-weight:700;white-space:nowrap} .tilt{color:var(--red);font-weight:700;white-space:nowrap}
  .pnote{color:var(--muted);font-size:13px;margin:8px 0}
  .pcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;margin:10px 0}
</style>
</head>
<body>
<!-- A verzió-sáv és a kapu látványpróbája HAMIS adattal: nincs bejelentkezés, nincs adatbázis, semmi nem megy ki a
     hálózatra. A futó verziót és a verzio.json választ a lap maga adja. Az app saját stílusa (styles.css) és
     saját kódja (js/version.js) fut. Megnyitás a helyi kiszolgálóról: /scripts/tests/verzio-sav-proba.html
     Paraméterek: ?allapot=regi (alap) | friss | hiba    &tilt=torzs (alap) | minden -->
<script>
  const Q = new URLSearchParams(location.search), ALLAPOT = Q.get("allapot") || "regi", TILT = Q.get("tilt") || "torzs";
  window.APP_VERSION = "proba-1";                                   // a „futó kód” verziója
  const valodiFetch = window.fetch.bind(window);
  window.__kimentek = [];
  window.fetch = async (input, init) => {                           // a verzio.json válasza: a lap adja, hálózat nélkül
    const u = typeof input === "string" ? input : input.url;
    if (u.includes("verzio.json")) {
      if (ALLAPOT === "hiba") return new Response("Not Found", { status: 404 });
      return new Response(JSON.stringify({ v: ALLAPOT === "friss" ? "proba-1" : "proba-2", tilt: TILT, epitve: "2026-01-01T00:00:00.000Z" }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return valodiFetch(input, init);
  };
</script>

<div id="app">
  <header class="top"><div class="wrap">
    <div class="verbar" id="verbar" hidden role="status">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      <span>Új verzió érhető el. A mentéshez töltsd újra az oldalt.</span>
      <button type="button" id="verReload">Újratöltés</button>
    </div>
    <div class="brand">
      <h1 class="display">Lapról Lapra</h1>
      <button class="iconbtn" title="Sorozataim"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></button>
      <button class="iconbtn" title="Újdonságok"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 00-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M9.5 20a2.5 2.5 0 005 0"/></svg></button>
      <button class="iconbtn emph pink" title="Súgó"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    </div>
    <div class="tabbar"><button class="tabnow">Próbasorozat</button><button class="tabtoggle">Sorozatok ▾</button></div>
  </div></header>
  <main class="wrap">
    <p class="pnote" id="allapot"></p>
    <div class="pcard"><b>A sáv a fejléc része:</b> a tartalmat lejjebb tolja, nem takar el semmit. Görgetéskor a fejléccel együtt fent marad.</div>
    <h3 style="margin:16px 0 4px;font-size:15px">A kapu döntései (a valódi <code>gatedFetch</code> hívásával, hamis célcímmel)</h3>
    <table class="pt"><thead><tr><th>Művelet</th><th>Kérés</th><th>Eredmény</th></tr></thead><tbody id="rows"></tbody></table>
    <p class="pnote" id="uzenet"></p>
    <div class="pcard" style="height:520px">Töltelék a görgetéshez.</div>
  </main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { checkVersion, onStale, gatedFetch, STALE_MESSAGE } from "../../js/version.js";
const B = "https://pelda.supabase.co";
onStale(() => { document.getElementById("verbar").hidden = false; });
document.getElementById("verReload").addEventListener("click", () => { document.getElementById("uzenet").textContent = "Az Újratöltés gomb megnyomva — a próbaoldalon nem tölt újra (az appban: location.reload())."; });
const s = await checkVersion(true);
document.getElementById("allapot").textContent = `Próba-állapot: a futó kód verziója „proba-1”; a szerver válasza: ${ALLAPOT === "hiba" ? "hiba (404)" : ALLAPOT === "friss" ? "ugyanaz (proba-1)" : "más (proba-2)"}; tiltási szint: ${TILT}. Eredmény: ${s ? "RÉGI — a sáv látszik" : "nem régi — nincs sáv, minden megy"}.`;
// A kapu mögé hamis „hálózat” kerül: ami ide eljut, az „kiment volna”. Valódi kérés nem megy sehová.
const kapu = gatedFetch(async () => new Response("{}", { status: 200, headers: { "Content-Type": "application/json" } }));
const SOR = [
  ["Sorozatok, Számok olvasása", "GET", "/rest/v1/series?select=*"],
  ["Belépés megújítása", "POST", "/auth/v1/token?grant_type=refresh_token"],
  ["„megvan” jelölés, darabszám, jegyzet", "POST", "/rest/v1/member_status?on_conflict=user_id,component_id"],
  ["fizetett ár, beszerzés", "POST", "/rest/v1/member_issue_data?on_conflict=user_id,issue_id"],
  ["sorozat beválasztása", "POST", "/rest/v1/member_series?on_conflict=user_id,series_id"],
  ["felkiáltójel nyugtázása", "POST", "/rest/v1/member_seen?on_conflict=user_id,entity_type,entity_id"],
  ["„Mind elfogadom” (alapvonal)", "POST", "/rest/v1/rpc/seed_member_seen"],
  ["„Kész” előtti figyelmeztetések (olvasó függvény)", "POST", "/rest/v1/rpc/draft_ready_warnings"],
  ["lapszám-ütközés ellenőrzése (olvasó függvény)", "POST", "/rest/v1/rpc/draft_lapszam_conflicts"],
  ["kép letöltése", "GET", "/storage/v1/object/component-images/components/x/live.jpg"],
  ["+ Új tétel (új Szám)", "POST", "/rest/v1/rpc/create_live_issue"],
  ["szerkesztés indítása", "POST", "/rest/v1/rpc/start_edit_draft"],
  ["munkaanyag: Szám mentése", "PATCH", "/rest/v1/draft_issues?id=eq.1"],
  ["„Kész”", "POST", "/rest/v1/rpc/mark_draft_ready"],
  ["publikálás", "POST", "/rest/v1/rpc/publish_draft_series"],
  ["Listák: hozzáadás", "POST", "/rest/v1/lists"],
  ["Listák: átnevezés", "PATCH", "/rest/v1/lists?tipus=eq.forras&ertek=eq.x"],
  ["feltöltés engedélyezése (kapcsoló)", "PATCH", "/rest/v1/components?id=eq.1"],
  ["kép feltöltése", "POST", "/storage/v1/object/component-images/components/x/live.jpg"],
  ["kép törlése", "DELETE", "/storage/v1/object/component-images"],
  ["képjavaslat beküldése", "POST", "/rest/v1/image_proposals"],
  ["új sorozat javaslása", "POST", "/rest/v1/draft_series"],
  ["felhasználó letiltása", "PATCH", "/rest/v1/members?user_id=eq.1"],
];
let elso = "";
const rows = [];
for (const [nev, m, p] of SOR) {
  const r = await kapu(B + p, { method: m });
  const tiltva = r.status === 409;
  if (tiltva && !elso) elso = (await r.clone().json()).message;
  rows.push(`<tr><td>${nev}</td><td><code>${m} ${p.split("?")[0]}</code></td><td class="${tiltva ? "tilt" : "megy"}">${tiltva ? "✕ tiltva" : "✓ megy"}</td></tr>`);
}
document.getElementById("rows").innerHTML = rows.join("");
document.getElementById("uzenet").textContent = elso ? "A tiltott gombnál megjelenő üzenet: „Hiba: " + elso + "”" + (elso === STALE_MESSAGE ? "" : " (ELTÉR a várt szövegtől!)") : "Nincs tiltott kérés.";
window.__proba = { regi: !!s, tiltva: SOR.filter((_, i) => rows[i].includes("tiltva")).map(x => x[0]), megy: SOR.filter((_, i) => rows[i].includes("megy")).map(x => x[0]) };
</script>
</body>
</html>
