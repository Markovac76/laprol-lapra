<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>Lapról Lapra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== BEJELENTKEZÉS ===== -->
<div class="gate" id="gate">
  <div class="card">
    <h1 class="display">Lapról Lapra</h1>
    <p class="sub">Jelentkezz be a gyűjteményedhez.</p>
    <div class="field"><label>E-mail</label><input id="g-email" type="email" autocomplete="username" placeholder="te@pelda.hu"></div>
    <div class="field"><label>Jelszó</label><input id="g-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="g-in">Belépés</button>
    <div class="err" id="g-err"></div>
    <p class="note" id="g-switchwrap">Nincs még fiókod? <a href="#" id="g-switch">Regisztrálj</a></p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <header class="top"><div class="wrap">
    <div class="brand">
      <h1 class="display">Lapról Lapra</h1>
      <button class="iconbtn" id="mySeriesBtn" title="Sorozataim">📚</button>
      <button class="iconbtn" id="admToggle" title="Gyors szerkesztés" aria-pressed="false">🔧</button>
      <button class="iconbtn" id="kbToggle" title="Karbantartás" style="display:none">🗂️</button>
      <button class="iconbtn" id="usersBtn" title="Felhasználók" style="display:none">👥</button>
      <button class="iconbtn emph pink" id="helpBtn" title="Súgó">❓</button>
      <button class="iconbtn emph amber" id="logout" title="Kijelentkezés">⎋</button>
    </div>
    <div class="tabbar">
      <button class="tabnow" id="tabnow"></button>
      <button class="tabtoggle" id="tabtoggle" aria-expanded="false" title="Sorozatok">Sorozatok ▾</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" hidden></div>
  </div></header>
  <main class="wrap">
    <section class="hero" id="hero"></section>
    <div class="admbar" id="admbar" style="display:none">
      <button id="a-item">+ Új tétel</button>
      <button id="a-lists">☰ Listák</button>
      <button id="a-template" class="desktop-only">⬇ Sablon</button>
      <button id="a-upload" class="desktop-only">⬆ Excel</button>
    </div>
    <input type="file" id="upl" accept=".xlsx,.xls,.csv" style="display:none">
    <input type="file" id="imgUpl" accept="image/*" style="display:none">
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Keresés név vagy szám szerint…">
      <div class="chips" id="chips" role="group"></div>
    </div>
    <div class="listhead" id="listhead"></div>
    <div class="list" id="list"></div>
  </main>
  <footer class="wrap">Adatok: a te privát Supabase-adatbázisodból · telefon–gép szinkron.</footer>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
