<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>Lapról Lapra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1220; --panel:#171a2b; --panel-2:#1e2236; --line:#2a2f47;
    --ink:#eef0f8; --muted:#a2a8c3; --faint:#6f7699; --accent:#3a6ea5;
    --green:#37c26b; --green-d:#15361f; --amber:#e0a13a; --amber-d:#3a2c12;
    --red:#e0574a; --red-d:#3a1512;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 100% -10%, rgba(58,110,165,.10), transparent 60%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100dvh;padding:0 0 env(safe-area-inset-bottom)}
  .display{font-family:"Space Grotesk",inherit}
  .wrap{max-width:660px;margin:0 auto;padding:0 14px}
  button{font-family:inherit}

  .gate{position:fixed;inset:0;z-index:50;background:radial-gradient(700px 400px at 50% 0%, rgba(58,110,165,.18), transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
  .gate.hidden{display:none}
  .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
  .card h1{font-family:"Space Grotesk";font-size:22px;margin:0 0 4px}
  .card p.sub{color:var(--faint);font-size:13px;margin:0 0 20px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:12px;font-size:15px}
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;font-family:"Space Grotesk"}
  .btn:disabled{opacity:.6;cursor:default}
  .err{color:#f3b6b6;font-size:13px;margin-top:10px;min-height:16px}

  header.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,rgba(15,18,32,.86));backdrop-filter:blur(8px);padding-top:calc(env(safe-area-inset-top) + 12px)}
  .brand{display:flex;align-items:center;gap:8px;padding:8px 2px 10px}
  .brand h1{font-family:"Space Grotesk";font-size:19px;font-weight:700;margin:0;flex:1}
  .brand .iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);width:38px;height:34px;border-radius:10px;font-size:15px;cursor:pointer}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 0 10px 0}
  .tab{display:flex;align-items:center;justify-content:center;text-align:center;
    border:1px solid color-mix(in srgb,var(--tabc) 55%,var(--line));
    background:color-mix(in srgb,var(--tabc) 22%,var(--panel));color:#e8ecf7;
    padding:8px 8px;border-radius:12px;font-size:clamp(12.5px,3.3vw,15px);font-weight:700;cursor:pointer;
    transition:.15s;font-family:"Space Grotesk";min-width:0;min-height:46px;line-height:1.15}
  .tab .lbl{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .tab[aria-selected="true"]{color:#fff;background:color-mix(in srgb,var(--tabc) 62%,var(--panel));
    border-color:var(--tabc);box-shadow:inset 0 0 0 2px var(--tabc)}

  .hero{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin:6px 0 12px}
  .hero .kiado{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;filter:brightness(1.25)}
  .hero .name{font-family:"Space Grotesk";font-size:22px;font-weight:700;margin:3px 0 12px}
  .closedtag{display:inline-block;vertical-align:middle;margin-left:8px;font-family:inherit;font-size:11px;
    font-weight:600;letter-spacing:.03em;color:var(--muted);background:var(--panel-2);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .prog{margin:8px 0}
  .prog .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
  .prog .lab b{font-family:"Space Grotesk"}
  .bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#fff));transition:width .5s}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--faint);text-transform:uppercase}
  .stat .v{font-family:"Space Grotesk";font-size:17px;font-weight:700;margin-top:2px}
  .stat.wide{grid-column:1/-1}.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}

  .controls{padding:2px 0 8px}
  .search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:11px 13px;font-size:15px;margin-bottom:8px}
  .search:focus{outline:2px solid var(--accent);outline-offset:1px}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);color:#12131c;border-color:transparent}.chip .n{opacity:.65;margin-left:5px}

  .list{display:flex;flex-direction:column;gap:9px;padding:2px 0 24px}
  .issue{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
  .ihead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .rmain{min-width:0}
  .listhead{position:sticky;z-index:15;top:var(--headh,150px);display:flex;align-items:center;gap:10px;
    padding:7px 12px;margin-bottom:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .listhead .lh-left{flex:1;min-width:0}
  .listhead .lh-c{width:44px;text-align:center;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;font-size:11.5px}
  .marks{display:flex;gap:5px;flex:0 0 auto;align-items:flex-start}
  .mark{border:1px solid var(--line);background:var(--panel-2);color:var(--faint);
    width:52px;border-radius:10px;cursor:pointer;transition:.12s;padding:5px 2px 4px;
    display:flex;flex-direction:column;align-items:center;gap:2px}
  .mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mark .mlab{font-size:9.5px;font-weight:600;line-height:1.1;min-height:11px;letter-spacing:.01em}
  .mark:active{transform:scale(.94)}
  .mark.m-megvan{background:var(--green-d);border-color:var(--green);color:#8ee9ad}
  .mark.m-hianyzik{background:var(--red-d);border-color:var(--red);color:#f5a8a0}
  .mark.m-nemkell{background:#252a3a;border-color:#5f6780;color:#c3c9db}
  .mark:disabled{opacity:.3;cursor:not-allowed}
  .expander{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);width:34px;
    border-radius:10px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;align-self:stretch}
  .expander svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
  .expander[aria-expanded="true"] svg{transform:rotate(180deg)}
  .expander[aria-expanded="true"]{background:color-mix(in srgb,var(--accent) 25%,var(--panel-2));border-color:var(--accent);color:#fff}

  .issue{position:relative;overflow:hidden}
  .issue.i-megvan,.issue.i-reszleges,.issue.i-hianyzik,.issue.i-nemkell{padding-left:18px}
  .issue.i-megvan::before,.issue.i-reszleges::before,.issue.i-hianyzik::before,.issue.i-nemkell::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:8px}
  .issue.i-megvan{background:color-mix(in srgb,var(--green) 34%,var(--panel));border-color:var(--green)}
  .issue.i-megvan::before{background:var(--green)}
  .issue.i-reszleges{background:color-mix(in srgb,var(--amber) 34%,var(--panel));border-color:var(--amber)}
  .issue.i-reszleges::before{background:var(--amber)}
  .issue.i-hianyzik{background:color-mix(in srgb,var(--red) 34%,var(--panel));border-color:var(--red)}
  .issue.i-hianyzik::before{background:var(--red)}
  .issue.i-nemkell{background:#2a3042;border-color:#6b748c}
  .issue.i-nemkell::before{background:#6b748c}

  .imgpanel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .imgcard{flex:0 1 190px;max-width:190px}
  .imgbox{height:130px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--faint);font-size:12px}
  .imgbox img{width:100%;height:100%;object-fit:cover}
  .imgcap{margin-top:5px;text-align:center}
  .imgcap .cn{font-size:12px;font-weight:600;color:var(--ink)}
  .imgcap .cc{font-size:10.5px;color:var(--faint);font-family:ui-monospace,monospace}
  .costbtn{margin-top:6px;background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:600;cursor:pointer}
  .costbtn.show{color:var(--accent);filter:brightness(1.25);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .cid{font-size:10.5px;color:var(--faint);font-family:ui-monospace,monospace}
  .num{font-family:"Space Grotesk";font-weight:700;font-size:13px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:color-mix(in srgb,var(--accent) 20%,var(--panel-2));color:#fff;border:1px solid var(--line)}
  .ititle{font-size:15px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .ititle.empty{color:var(--faint);font-style:italic;font-weight:400}
  .imeta{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:4px;font-size:12px;font-weight:400;color:var(--muted)}
  .imeta span{font-size:12px;font-weight:400;font-family:inherit;letter-spacing:0}
  .imeta .future{color:#ff6a5c;font-weight:600}
  .imeta .money{color:var(--ink)}
  .imeta .cid{color:var(--faint)}
  .empty-state{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
  .loading{text-align:center;color:var(--muted);padding:60px 16px;font-size:15px}
  footer{color:var(--faint);font-size:11.5px;text-align:center;padding:8px 0 26px}

  /* --- Karbantartó eszköztár --- */
  .admbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .admbar button{flex:1 1 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:11px;padding:10px 8px;font-size:12.5px;font-weight:600;cursor:pointer;min-width:0}
  .admbar button:active{transform:scale(.97)}
  .iconbtn.on{background:var(--accent);color:#fff;border-color:transparent}
  @media (max-width:719px){ .desktop-only{display:none!important} }
  .rowedit{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:10px;
    width:34px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;align-self:stretch;font-size:14px}

  /* --- Modál --- */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(5,7,15,.72);display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
  @media(min-width:560px){.modal{align-items:center}.sheet{border-radius:20px}}
  .sheet h2{font-family:"Space Grotesk";font-size:18px;margin:0 0 4px}
  .sheet .msub{color:var(--faint);font-size:12.5px;margin:0 0 14px}
  .sheet .field select,.sheet .field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);
    border-radius:11px;color:var(--ink);padding:11px;font-size:15px;font-family:inherit}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .swatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .swatch[aria-pressed="true"]{border-color:#fff}
  .compchecks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .compcheck{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:999px;
    padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .compcheck[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
  .compedit{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:var(--panel-2)}
  .compedit h4{margin:0 0 2px;font-size:13px;color:var(--accent);filter:brightness(1.3)}
  .compedit .kod{font-size:10.5px;color:var(--faint);font-family:ui-monospace,monospace;margin-bottom:8px}
  .statrow{display:flex;gap:6px;margin-top:4px}
  .statrow button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    border-radius:9px;padding:9px 4px;font-size:12px;font-weight:600;cursor:pointer}
  .statrow button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
  .modrow{display:flex;gap:8px;margin-top:16px}.modrow .btn{flex:1}
  .btn.danger{background:transparent;color:#f3b6b6;border:1px solid #6b3a3a}
  .example{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
    font-size:11.5px;color:var(--muted);white-space:pre-wrap;font-family:ui-monospace,monospace;margin-top:6px}
  .listgrp{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--panel-2)}
  .listgrp h4{margin:0 0 6px;font-size:13px;color:var(--ink)}
  .listgrp .vals{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .listgrp .val{font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
  .addrow{display:flex;gap:6px}
  .addrow input{flex:1}
  .addrow button{border:1px solid var(--line);background:var(--accent);color:#fff;border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:380px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ===== BEJELENTKEZÉS ===== -->
<div class="gate" id="gate">
  <div class="card">
    <h1 class="display">Lapról Lapra</h1>
    <p class="sub">Jelentkezz be a gyűjteményedhez.</p>
    <div class="field"><label>E-mail</label><input id="g-email" type="email" autocomplete="username" placeholder="te@pelda.hu"></div>
    <div class="field"><label>Jelszó</label><input id="g-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="g-in">Belépés</button>
    <div class="err" id="g-err"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <header class="top"><div class="wrap">
    <div class="brand">
      <h1 class="display">Lapról Lapra</h1>
      <button class="iconbtn" id="admToggle" title="Karbantartás" aria-pressed="false">🔧</button>
      <button class="iconbtn" id="logout" title="Kijelentkezés">⎋</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div></header>
  <main class="wrap">
    <section class="hero" id="hero"></section>
    <div class="admbar" id="admbar" style="display:none">
      <button id="a-item">+ Új tétel</button>
      <button id="a-editseries">✎ Sorozat</button>
      <button id="a-series">+ Új sorozat</button>
      <button id="a-lists">☰ Listák</button>
      <button id="a-template" class="desktop-only">⬇ Sablon</button>
      <button id="a-upload" class="desktop-only">⬆ Excel</button>
    </div>
    <input type="file" id="upl" accept=".xlsx,.xls,.csv" style="display:none">
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Keresés név vagy szám szerint…">
      <div class="chips" id="chips" role="group"></div>
    </div>
    <div class="listhead" id="listhead"></div>
    <div class="list" id="list"></div>
  </main>
  <footer class="wrap">Adatok: a te privát Supabase-adatbázisodból · telefon–gép szinkron.</footer>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ============================================================
   CONFIG — a beállítások a külön config.js fájlból jönnek.
   Ezt a fájlt NEM kell szerkesztened frissítéskor.
   (Mintát lásd: config.example.js)
   ============================================================ */
const SUPABASE_URL = window.SUPABASE_URL || "https://jwiujuxvymzxjpphrgip.supabase.co";
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY || "hianyzik", {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "laprol-lapra-auth" }
});

/* ---- állapot ---- */
let SERIES=[], activeIdx=0, filter="mind", query="", adminMode=false, LISTS={};
const PAL12=["#3a6ea5","#d21f2b","#7b52b8","#2e9e8f","#c9772e","#c94f9e","#4f7bd2","#e0a13a","#6bbf59","#b0504d","#3aa6b9","#8a7dd6"];
const DISPLAY_MAX=16;
const COMP_TYPES={magazin:"Magazin",modell:"Modell",konyv:"Könyv",egyeb:"Egyéb"};
const PAL_FALLBACK="#3a6ea5";
const HU_MON=["jan.","febr.","márc.","ápr.","máj.","jún.","júl.","aug.","szept.","okt.","nov.","dec."];
const todayISO=new Date().toISOString().slice(0,10);
const fmtDate=iso=>{ if(!iso) return null; const[y,m,d]=iso.split("-").map(Number); return `${y}. ${HU_MON[m-1]} ${d}.`; };
const fmtFt=n=>n==null?null:n.toLocaleString("hu-HU").replace(/,/g," ")+" Ft";
const S=()=>SERIES[activeIdx];
const pad=(x,l)=>String(x).padStart(l,"0");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- adatok betöltése a Supabase-ből ---- */
async function loadData(){
  document.getElementById("list").innerHTML=`<div class="loading">Adatok betöltése…</div>`;
  const [s,i,c,l]=await Promise.all([
    supabase.from("series").select("*").order("sort_order"),
    supabase.from("issues").select("*"),
    supabase.from("components").select("*"),
    supabase.from("lists").select("*").order("sort_order"),
  ]);
  if(s.error||i.error||c.error){ throw (s.error||i.error||c.error); }
  LISTS={};
  if(!l.error && l.data) l.data.forEach(r=>{ (LISTS[r.tipus]=LISTS[r.tipus]||[]).push({ertek:r.ertek,nev:r.megjelenites||r.ertek}); });
  const byS={}, byI={};
  SERIES = s.data.map(r=>{ const o={id:r.id,kiado:r.kiado,sorozat:r.megnevezes,display:r.megjelenites,accent:r.szin||PAL_FALLBACK,components:r.components||[],kodSzam:r.kod_szam||null,items:[]}; byS[r.id]=o; return o; });
  i.data.forEach(r=>{ const o={id:r.id,n:r.lapszam,name:r.cim,date:r.megjelenes,fedelar:r.fedelar,fizetve:r.beszerzesi_ar,fizetve_datum:r.beszerzes_datuma,forras:r.forras,comps:{}}; byI[r.id]=o; const ser=byS[r.series_id]; if(ser) ser.items.push(o); });
  c.data.forEach(r=>{ const it=byI[r.issue_id]; if(it) it.comps[r.tipus]={id:r.id,status:r.status,azonosito:r.azonosito,azonosito_tipus:r.azonosito_tipus,note:r.jegyzet,kep_url:r.kep_url}; });
  SERIES.forEach(x=>x.items.sort((a,b)=>a.n-b.n));
  if(activeIdx>=SERIES.length) activeIdx=0;
}

/* ---- statisztika ---- */
function stats(si){
  const s=SERIES[si]; const perType={}; s.components.forEach(t=>perType[t]={owned:0,total:s.items.length});
  let belekerulesi=0, beszerzendo=0, next=null, hasFuture=false;
  for(const it of s.items){
    if(it.fizetve) belekerulesi+=it.fizetve;
    const future=it.date&&it.date>todayISO;
    if(future) hasFuture=true;
    for(const t of s.components){ const st=it.comps[t]?it.comps[t].status:null;
      if(st==="megvan") perType[t].owned++; }
    // Beszerzendő: LAPSZÁM-szinten — ami megjelent, és se nem kész (zöld), se nem kihúzott (szürke)
    if(!future){ const state=issueState(it,s); if(state!=="megvan" && state!=="nemkell") beszerzendo++; }
    const anyOpen=s.components.some(t=>{const st=it.comps[t]?it.comps[t].status:null; return st!=="megvan"&&st!=="nemkell";});
    if(anyOpen && it.date && it.date>=todayISO){ if(!next||it.date<next.date) next=it; }
  }
  return {perType,belekerulesi,beszerzendo,next,hasFuture};
}

// Ha még jelöletlen → első koppintás "megvan". Utána a három állapot körbe (jelöletlenre nem tér vissza).
function nextStatus(cur){
  if(!cur) return "megvan";
  const o=["megvan","hianyzik","nemkell"];
  return o[(o.indexOf(cur)+1)%o.length];
}

// Hierarchia: a nem-magazin komponens dominál; ha csak egy van, az.
function dominantType(s){
  const nm=s.components.filter(t=>t!=="magazin");
  return nm.length ? nm[0] : (s.components[0]||null);
}
function issueState(it,s){
  if(it.date && it.date>todayISO) return null;                  // még nem jelent meg → semleges
  const dt=dominantType(s); if(!dt) return null;
  const d=(it.comps[dt]&&it.comps[dt].status)||null;
  if(!d) return null;                                           // domináns jelöletlen → semleges
  if(d==="megvan") return "megvan";                             // zöld
  if(d==="nemkell") return "nemkell";                           // szürke
  const mag = s.components.includes("magazin") ? ((it.comps.magazin&&it.comps.magazin.status)||null) : null;
  return mag==="megvan" ? "reszleges" : "hianyzik";             // sárga, ha a magazin megvan; egyébként piros
}

    </div>

        const so=SERIES.length;
        const kodSzam=await nextSeriesNo();
        const {error}=await supabase.from("series").insert({...payload, sort_order:so, kod_szam:kodSzam}); if(error) throw error;
      }
      closeModal(); await reload(); if(!s) activeIdx=SERIES.length-1; renderAll();
    }catch(e){ err(e); }
  };
  const sd=document.getElementById("s-del");
  if(sd) sd.onclick=async ()=>{
    if(SERIES.length<=1){ alert("Legalább egy sorozatnak maradnia kell."); return; }
    if(!confirm(`Biztosan törlöd a(z) „${s.sorozat}” sorozatot és MINDEN tételét?`)) return;
    try{ const {error}=await supabase.from("series").delete().eq("id",s.id); if(error) throw error;
      closeModal(); activeIdx=0; await reload(); }catch(e){ err(e); }
  };
}

/* ---- Listatár bővítése ---- */
const LIST_TITLES={kiado:"Kiadó",komponens:"Komponens-típus",azonosito:"Azonosító típusa",forras:"Beszerzés forrása"};
function listsForm(){
  const grps=Object.keys(LIST_TITLES).map(t=>`
    <div class="listgrp"><h4>${LIST_TITLES[t]}</h4>
      <div class="vals">${(LISTS[t]||[]).map(o=>`<span class="val">${esc(o.nev)}</span>`).join("")||'<span class="val">—</span>'}</div>
      <div class="addrow"><input id="nl-${t}" placeholder="új érték neve"><button data-add="${t}">+</button></div>
    </div>`).join("");
  openModal(`<h2>Listák</h2><p class="msub">Itt bővítheted a választható értékeket. Rögzítés közben nem lehet bővíteni — így a listák nem híznak el.</p>
    ${grps}
    <div class="modrow"><button class="btn" onclick="closeModal()">Kész</button></div>`);
  sheet.addEventListener("click",async e=>{
    const b=e.target.closest("[data-add]"); if(!b) return;
    const t=b.dataset.add, inp=document.getElementById("nl-"+t);
    const nev=inp.value.trim(); if(!nev) return;
    const ertek=nev.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"");
    if(!ertek){ alert("Adj meg érvényes nevet."); return; }
    try{
      const so=(LISTS[t]||[]).length+1;
      const {error}=await supabase.from("lists").insert({tipus:t, ertek, megjelenites:nev, sort_order:so});
      if(error) throw error;
      (LISTS[t]=LISTS[t]||[]).push({ertek,nev}); inp.value=""; listsForm();
    }catch(e){ err(e); }
  });
}

/* ---- Soha vissza nem forgó sorozat-kód számláló ---- */
async function nextSeriesNo(){
  const uid=(await supabase.auth.getUser()).data.user.id;
  let {data,error}=await supabase.from("counters").select("*").eq("user_id",uid).maybeSingle();
  if(error) throw error;
  if(!data){
    const ins=await supabase.from("counters").insert({user_id:uid,next_series_no:2}).select().single();
    if(ins.error) throw ins.error;
    return 1;
  }
  const no=data.next_series_no;
  const {error:upErr}=await supabase.from("counters").update({next_series_no:no+1}).eq("user_id",uid);
  if(upErr) throw upErr;
  return no;
}

/* ---- Excel: sablon + feltöltés (csak asztali) ---- */
let _xlsx=null; async function xlsx(){ if(!_xlsx) _xlsx=await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm"); return _xlsx; }
const HU_MONTHS={jan:1,január:1,febr:2,február:2,márc:3,március:3,ápr:4,április:4,
  máj:5,május:5,jún:6,június:6,júl:7,július:7,aug:8,augusztus:8,
  szept:9,szeptember:9,okt:10,október:10,nov:11,november:11,dec:12,december:12};
function isoDate(y,mo,d){ y=parseInt(y); mo=parseInt(mo); d=parseInt(d);
  if(!y||mo<1||mo>12||d<1||d>31) return null;
  return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function coerceDate(v){
  if(v==null||v==="") return null;
  if(v instanceof Date && !isNaN(v)) return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  let s=String(v).trim(); if(!s) return null;
  // ÉÉÉÉ-HH-NN / ÉÉÉÉ.HH.NN / ÉÉÉÉ/HH/NN
  let m=s.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})\.?$/);
  if(m) return isoDate(m[1],m[2],m[3]);
  // Excel-féle, magyar hónapnévvel/szóközzel tördelt alak: "2025- aug- 26", "2025 augusztus 26."
  m=s.toLowerCase().match(/^(\d{4})[.\-\s]+([a-záéíóöőúüű]+)\.?[.\-\s]+(\d{1,2})\.?$/i);
  if(m){ const mo=HU_MONTHS[m[2].replace(/\.$/,"")]; if(mo) return isoDate(m[1],mo,m[3]); }
  return null;  // felismerhetetlen formátum → nem dob hibát, csak üresen marad
}
function parseHuNumber(v){
  if(v==null || v==="") return null;
  if(typeof v==="number") return Math.round(v);
  let s=String(v).trim(); if(!s) return null;
  const neg=s.startsWith("-");
  // "1.490,50" vagy "1490,50" alakú tizedes vessző esetén kezeljük tizedesként
  const m=s.match(/^-?\d{1,3}(?:[ .]\d{3})*,(\d{1,2})$/);
  if(m){ const num=parseFloat(s.replace(/[ .]/g,"").replace(",",".")); return Math.round(num); }
  // egyébként minden nem-számjegyet eltávolítunk (ezres pont/vessző/szóköz mind eltűnik)
  const digits=s.replace(/[^\d]/g,"");
  if(!digits) return null;
  return (neg?-1:1)*parseInt(digits,10);
}
function normStatus(v){ if(!v) return undefined; const t=String(v).trim().toLowerCase().replace(/\s+/g,"");
  if(t==="megvan")return"megvan"; if(t==="hianyzik"||t==="hiányzik"||t==="hiany"||t==="hiány")return"hianyzik";
  if(t==="nemkell")return"nemkell"; return undefined; }
function tmplHead(s){ const h=["lapszám","cím","dátum (Excel dátum, pl. 2026.03.15)","fedélár (csak szám)","beszerzési ár (csak szám)"];
  s.components.forEach(t=>{ h.push((COMP_TYPES[t]||t)+" státusz (megvan/hianyzik/nemkell)"); h.push((COMP_TYPES[t]||t)+" azonosító"); }); return h; }
async function downloadTemplate(){
  const s=S();
  if(!s){ alert("Előbb hozz létre egy sorozatot (+ Új sorozat), utána tudsz hozzá sablont letölteni."); return; }
  try{
    const X=await xlsx(), head=tmplHead(s);
    // valódi Excel dátum- és szám-típusú példacellák, hogy Excel a helyes formátumot ajánlja fel
    const ex1=[1,"Példa – írd át vagy töröld", new Date(2026,2,15), 2490, ""];
    s.components.forEach(()=>{ ex1.push("megvan"); ex1.push(""); });
    const ex2=[2,"Másik példa", new Date(2026,3,15), 1490, 1490];
    s.components.forEach(()=>{ ex2.push(""); ex2.push(""); });
    const ws=X.utils.aoa_to_sheet([head,ex1,ex2], {cellDates:true});
    ws["!cols"]=head.map(h=>({wch:Math.max(14,h.length+2)}));
    // pénz-oszlopok (D, E) explicit szám-formátum
    ["D2","E2","D3","E3"].forEach(ref=>{ if(ws[ref]) ws[ref].z='#,##0" Ft"'; });
    if(ws["C2"]) ws["C2"].z="yyyy-mm-dd"; if(ws["C3"]) ws["C3"].z="yyyy-mm-dd";
    const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,"Sorozat");
    X.writeFile(wb,`laprol-lapra-sablon-${(s.display||s.sorozat).replace(/\s+/g,"-")}.xlsx`);
  }catch(e){ err(e); }
}
async function handleUpload(file){
  const s=S();
  if(!s){ alert("Előbb hozz létre egy sorozatot (+ Új sorozat), utána tudsz hozzá Excelt feltölteni."); return; }
  let plan=[], dateWarnings=[];
  try{
    const X=await xlsx(); const wb=X.read(await file.arrayBuffer(),{cellDates:true});
    const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
    let bad=0;
    for(const row of aoa){
      if(!row||!row.length) continue;
      const n=parseInt(String(row[0]).trim()); if(isNaN(n)){ bad++; continue; }
      const name=String(row[1]??"").trim(), date=coerceDate(row[2]);
      if(row[2] && String(row[2]).trim() && !date) dateWarnings.push(n);
      const fed=parseHuNumber(row[3]), fiz=parseHuNumber(row[4]);
      const p={}; if(name) p.cim=name; if(date) p.megjelenes=date;
      if(fed!=null) p.fedelar=fed; if(fiz!=null) p.beszerzesi_ar=fiz;
      const comps=[];
      for(let ci=0; ci<s.components.length; ci++){
        const t=s.components[ci];
        const st=normStatus(row[5+ci*2]); const az=String(row[6+ci*2]??"").trim();
        const cp={}; if(st!==undefined) cp.status=st; if(az) cp.azonosito=az;
        comps.push({t,cp});
      }
      const existing=s.items.find(x=>x.n===n);
      plan.push({n, p, comps, isNew:!existing});
    }
  }catch(e){ err(e); return; }

  if(!plan.length){ alert("Nem találtam feldolgozható sort a fájlban."); return; }
  const added=plan.filter(x=>x.isNew).length, updated=plan.length-added;
  const warnBlock = dateWarnings.length
    ? `<p class="msub" style="color:#f0cd8a">⚠ ${dateWarnings.length} sor dátuma nem volt felismerhető (#${dateWarnings.slice(0,8).join(", #")}${dateWarnings.length>8?"…":""}) — ezeknél a dátum üresen marad, a többi mező feltöltődik.</p>`
    : "";
  openModal(`<h2>Feltöltés megerősítése</h2>
    <p class="msub">Ez a fájl a <b>„${esc(s.sorozat)}”</b> sorozatba kerül.</p>
    ${warnBlock}
    <div class="example" style="font-size:13px">
${plan.length} sor feldolgozva a fájlból:
  • ${added} új tétel jön létre
  • ${updated} meglévő tétel frissül (felülíródik)
${plan.slice(0,5).map(x=>`  #${x.n}${x.p.cim?" – "+x.p.cim:""}${x.isNew?" (új)":" (frissül)"}`).join("\n")}${plan.length>5?"\n  …":""}
</div>
    <p class="msub" style="margin-top:10px">Ha ez nem a várt sorozat vagy a szám nem stimmel, inkább <b>Mégse</b>, és ellenőrizd, melyik fület nyitottad meg feltöltés előtt.</p>
    <div class="modrow"><button class="btn ghost" onclick="closeModal()">Mégse</button><button class="btn" id="up-confirm">Feltöltés a(z) „${esc(s.display||s.sorozat)}” sorozatba</button></div>`);

  document.getElementById("up-confirm").onclick=async ()=>{
    closeModal();
    try{
      let ins=0, upd=0;
      for(const item of plan){
        let it=s.items.find(x=>x.n===item.n), issueId;
        if(it){ issueId=it.id; if(Object.keys(item.p).length){ const {error}=await supabase.from("issues").update(item.p).eq("id",it.id); if(error) throw error; } upd++; }
        else { const {data,error}=await supabase.from("issues").insert({...item.p, series_id:s.id, lapszam:item.n}).select().single(); if(error) throw error; issueId=data.id; ins++; }
        for(const {t,cp} of item.comps){
          const cur=it?it.comps[t]:null;
          if(cur&&cur.id){ if(Object.keys(cp).length){ const {error}=await supabase.from("components").update(cp).eq("id",cur.id); if(error) throw error; } }
          else { const {error}=await supabase.from("components").insert({...cp, issue_id:issueId, tipus:t}); if(error) throw error; }
        }
      }
      await reload(); alert(`Feltöltve „${s.sorozat}” sorozatba.\nÚj: ${ins}, frissítve: ${upd}`);
    }catch(e){ err(e); }
  };
}

  catch(e){ document.getElementById("list").innerHTML=`<div class="empty-state">Hiba a betöltéskor: ${esc(e.message||e)}</div>`; }

function showGate(){ document.getElementById("app").style.display="none"; document.getElementById("gate").classList.remove("hidden"); }

document.getElementById("g-in").onclick=async ()=>{
  const btn=document.getElementById("g-in"), err=document.getElementById("g-err");
  err.textContent="";
  if(!SUPABASE_ANON_KEY){ err.textContent="Hiányzik a config.js fájl vagy az anon kulcs benne."; return; }
  btn.disabled=true; btn.textContent="Belépés…";
  const email=document.getElementById("g-email").value.trim();

  const {error}=await supabase.auth.signInWithPassword({email,password});

};

document.getElementById("logout").onclick=async ()=>{ await supabase.auth.signOut(); showGate(); };
