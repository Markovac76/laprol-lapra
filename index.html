<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>Lapról Lapra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== BEJELENTKEZÉS ===== -->
<div class="gate" id="gate">
  <div class="card">
    <h1 class="display">Lapról Lapra</h1>
    <p class="sub">Jelentkezz be a gyűjteményedhez.</p>
    <div class="field"><label>E-mail</label><input id="g-email" type="email" autocomplete="username" placeholder="te@pelda.hu"></div>
    <div class="field"><label>Jelszó</label><input id="g-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="g-in">Belépés</button>
    <div class="err" id="g-err"></div>
    <p class="note" id="g-switchwrap">Nincs még fiókod? <a href="#" id="g-switch">Regisztrálj</a></p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <header class="top"><div class="wrap">
    <div class="brand">
      <h1 class="display">Lapról Lapra</h1>
      <button class="iconbtn" id="kbToggle" title="Karbantartás" style="display:none"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg></button>
      <button class="iconbtn" id="admToggle" title="Gyors szerkesztés" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.77z"/></svg></button>
      <button class="iconbtn" id="mySeriesBtn" title="Sorozataim"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></button>
      <button class="iconbtn" id="usersBtn" title="Felhasználók" style="display:none"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></button>
      <button class="iconbtn" id="changelogBtn" title="Újdonságok"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 00-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M9.5 20a2.5 2.5 0 005 0"/></svg></button>
      <button class="iconbtn emph pink" id="helpBtn" title="Súgó"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
      <button class="iconbtn emph amber" id="logout" title="Kijelentkezés"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
    <div class="tabbar">
      <button class="tabnow" id="tabnow"></button>
      <button class="tabtoggle" id="tabtoggle" aria-expanded="false" title="Sorozatok">Sorozatok ▾</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" hidden></div>
  </div></header>
  <main class="wrap">
    <section class="hero" id="hero"></section>
    <div class="admbar" id="admbar" style="display:none">
      <button id="a-item">+ Új tétel</button>
      <button id="a-lists">☰ Listák</button>
      <button id="a-template">⬇ Sablon</button>
      <button id="a-upload">⬆ Excel</button>
    </div>
    <input type="file" id="upl" accept=".xlsx,.xls,.csv" style="display:none">
    <input type="file" id="imgUpl" accept="image/*" style="display:none">
    <input type="file" id="draftUpl" accept=".xlsx,.xls,.csv" style="display:none">
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Keresés név vagy szám szerint…">
      <div class="chips" id="chips" role="group"></div>
    </div>
    <div class="listhead" id="listhead"></div>
    <div class="list" id="list"></div>
  </main>
  <footer class="wrap">Adatok: a te privát Supabase-adatbázisodból · telefon–gép szinkron.</footer>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
